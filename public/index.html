<!DOCTYPE html>
<html>
<head>
    <title>Location Data Collector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        .status { padding: 15px; margin: 15px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin: 10px; }
        button:disabled { background: #ccc; }
        .container { display: flex; flex-direction: column; gap: 20px; }
        .data-box { border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Location Data Collection</h1>
        
        <div class="data-box">
            <h3>Automatic IP Geolocation</h3>
            <div id="ipStatus" class="status info">Collecting IP data...</div>
            <div id="ipData"></div>
        </div>
        
        <div class="data-box">
            <h3>GPS Location (Optional)</h3>
            <p>Click below to share your precise GPS location:</p>
            <button id="getGPSBtn" onclick="requestGPSLocation()">Share GPS Location</button>
            <div id="gpsStatus" class="status"></div>
            <div id="gpsData"></div>
        </div>
        
        <div class="data-box">
            <h3>Webhook Status</h3>
            <div id="webhookStatus"></div>
        </div>
    </div>
    
    <script>
        // Base URL for your Vercel deployment
        const API_BASE_URL = window.location.origin; // Will work on your Vercel domain
        
        // Run IP geolocation on page load
        window.addEventListener('load', () => {
            fetchIPGeolocation();
        });
        
        async function fetchIPGeolocation() {
            const statusEl = document.getElementById('ipStatus');
            
            try {
                statusEl.textContent = 'Sending IP geolocation data to server...';
                statusEl.className = 'status info';
                
                const response = await fetch(`${API_BASE_URL}/api/log`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userAgent: navigator.userAgent
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusEl.textContent = '✓ IP geolocation data sent successfully!';
                    statusEl.className = 'status success';
                    
                    // Display IP data
                    const ipDataEl = document.getElementById('ipData');
                    ipDataEl.innerHTML = `
                        <p><strong>IP:</strong> ${data.ipData['IP Address (ip)']}</p>
                        <p><strong>Location:</strong> ${data.ipData['City (city)']}, ${data.ipData['Country (name)']}</p>
                        <p><strong>Organization:</strong> ${data.ipData['Organization (organisation inside carriers)']}</p>
                    `;
                    
                    updateWebhookStatus('IP geolocation webhook sent successfully');
                } else {
                    throw new Error(data.error || 'Failed to send IP data');
                }
                
            } catch (error) {
                statusEl.textContent = `Error: ${error.message}`;
                statusEl.className = 'status error';
            }
        }
        
        async function requestGPSLocation() {
            const btn = document.getElementById('getGPSBtn');
            const statusEl = document.getElementById('gpsStatus');
            
            btn.disabled = true;
            btn.textContent = 'Requesting GPS...';
            statusEl.textContent = 'Requesting GPS permission...';
            statusEl.className = 'status info';
            
            if (!navigator.geolocation) {
                statusEl.textContent = 'Geolocation not supported by your browser';
                statusEl.className = 'status error';
                btn.disabled = false;
                btn.textContent = 'Share GPS Location';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const { latitude, longitude } = position.coords;
                    
                    statusEl.textContent = `GPS obtained: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}`;
                    statusEl.className = 'status success';
                    
                    try {
                        // Send GPS data to server
                        const response = await fetch(`${API_BASE_URL}/api/log`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userAgent: navigator.userAgent,
                                gpsCoordinates: { latitude, longitude }
                            })
                        });
                        
                        const data = await response.json();
                        
                        if (data.success && data.gpsDataSent) {
                            // Display GPS data
                            const gpsDataEl = document.getElementById('gpsData');
                            gpsDataEl.innerHTML = `
                                <p><strong>Precise Location:</strong> ${data.gpsData['City (city)']}, ${data.gpsData['Country (name)']}</p>
                                <p><strong>Address:</strong> ${data.gpsData['Locality (locality)']}, ${data.gpsData['Post Code (postcode)']}</p>
                                <p><strong>Timezone:</strong> ${data.gpsData['Timezone (ianaTimeId)']}</p>
                            `;
                            
                            updateWebhookStatus('GPS reverse geocode webhook sent successfully');
                        }
                        
                    } catch (error) {
                        statusEl.textContent = `Error sending GPS data: ${error.message}`;
                        statusEl.className = 'status error';
                    }
                    
                    btn.disabled = false;
                    btn.textContent = 'Share GPS Location';
                },
                (error) => {
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            statusEl.textContent = 'GPS permission denied. Using IP location only.';
                            break;
                        case error.POSITION_UNAVAILABLE:
                            statusEl.textContent = 'Location information unavailable.';
                            break;
                        case error.TIMEOUT:
                            statusEl.textContent = 'Location request timed out.';
                            break;
                        default:
                            statusEl.textContent = 'Error getting location.';
                    }
                    statusEl.className = 'status error';
                    btn.disabled = false;
                    btn.textContent = 'Share GPS Location';
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }
        
        function updateWebhookStatus(message) {
            const statusEl = document.getElementById('webhookStatus');
            statusEl.innerHTML = `<div class="status success">${message}</div>`;
        }
    </script>
</body>
</html>
